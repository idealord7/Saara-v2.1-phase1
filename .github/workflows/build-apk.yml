name: Build Android APK

on:
  push:
    branches: [ main, master, fix/whatsapp-gemini-autoreply, fix/firebase-data ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then ANDROID_HOME="$d"; break; fi
            done
          fi
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found" >&2
            exit 1
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -path '*cmdline-tools*/bin/sdkmanager' -type f 2>/dev/null | sort | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f 2>/dev/null | head -n 60 || true
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          find android -name "*.apk" -type f || true
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saara-v2.2.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: |
            android/app/build/outputs
            android/app/build/reports
            android/build/reports
          if-no-files-found: warn
