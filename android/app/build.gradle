plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.saara.assistant'; compileSdk 34
  defaultConfig { applicationId 'com.saara.assistant'; minSdk 26; targetSdk 34; versionCode 2; versionName '2.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0' }
